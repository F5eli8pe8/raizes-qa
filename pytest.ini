[pytest]
testpaths = tests
pythonpath = .
addopts = -ra --strict-markers
markers =
    unit: testes unitarios (camadas Domain e Application)
    integration: testes de integracao (API, banco e pagamento mock)
    system: testes de sistema ponta a ponta (cenarios CT)
    nonfunctional: testes nao funcionais (cenarios CNF)